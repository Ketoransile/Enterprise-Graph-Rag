[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-backend"
version = "0.1.0"
description = "Multi-tenant Graph-RAG backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn[standard]>=0.29.0,<0.30.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.1,<3.0.0",
  "sqlalchemy>=2.0.29,<3.0.0",
  "psycopg[binary,pool]>=3.1.18,<4.0.0",
  "pgvector>=0.2.5",
  "alembic>=1.13.1,<2.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "redis>=5.0.3,<6.0.0",
  "celery>=5.3.6,<6.0.0",
  "httpx>=0.27.0,<0.28.0",
  "neo4j>=5.21.0,<6.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "pymupdf>=1.24.0,<2.0.0",
  "python-docx>=1.1.0,<2.0.0",
  "langchain-text-splitters>=0.2.0,<1.0.0",
  "google-generativeai>=0.5.2",
  "slowapi>=0.1.9",
  "email-validator>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "black>=24.4.2,<25.0.0",
  "ruff>=0.4.4,<0.5.0",
  "isort>=5.13.2,<6.0.0",
  "pytest>=8.2.2,<9.0.0",
  "pytest-asyncio>=0.23.6,<0.24.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "mypy>=1.10.0,<2.0.0",
  "types-redis>=4.6.0,<5.0.0",
  "types-requests>=2.32.0,<3.0.0"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP", "ANN", "ASYNC", "A", "C4", "TID", "Q"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[project.scripts]
app = "app.main:run"
